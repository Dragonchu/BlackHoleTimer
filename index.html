<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Black Hole Timer</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js" defer></script>
    <script src="https://unpkg.com/gsap@3/dist/MotionPathPlugin.min.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="app">
      <div id="clock-wrapper">
        <div id="clock"></div>
      </div>

      <div id="controls">
        <button id="start-btn" aria-label="开始计时">开始计时</button>
        <div id="duration">
          <div class="label">分钟</div>
          <div id="wheel" tabindex="0" role="spinbutton" aria-valuemin="1" aria-valuemax="180" aria-valuenow="15" aria-label="倒计时分钟设置">15</div>
        </div>
      </div>

      <div id="stage" aria-hidden="true">
        <div id="blackhole">
          <div class="accretion"></div>
          <div class="core"></div>
        </div>
        <div id="particles"></div>
      </div>
    </div>
  </body>
  </html>
